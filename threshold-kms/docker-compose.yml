services:
  node-1:
    build: .
    container_name: kms-node-1
    environment:
      - NODE_ID=1
      - NODE_PORT=8001
      - K_THRESHOLD=3
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./certs/node-1.crt:/app/certs/node.crt:ro
      - ./certs/node-1.key:/app/certs/node.key:ro
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./db_data/node_1:/app/data
    networks:
      - kms_net

  node-2:
